# LLM Value Tracker — конфигурация.
# Любое значение можно переопределить переменной окружения (см. app/config.py).

server:
  host: 0.0.0.0
  port: 8000

worker:
  # Интервал обновления данных в минутах.
  refresh_interval_minutes: 360
  # Прогревать кэш при старте, если он пуст.
  warm_on_start: true

cache:
  backend: file            # file | (redis — TODO)
  path: data/snapshot.json

scoring:
  # Якорь Δ — медиана top_n лучших ПО РЕЙТИНГУ моделей категории (SPEC.md §2).
  top_n_for_median: 10
  token_share: 0.75        # доля входных токенов в blended_price (≈ 3:1 вход:выход)
  # Нижняя граница цены $/1M. Без неё бесплатные (`:free`) модели дают деление
  # на ноль и остаются без value. 0.01 — чуть ниже самой дешёвой платной модели
  # рынка ($0.025 на 2026-09-08), так что порог не искажает платную часть.
  price_floor_1M: 0.01
  presets:
    # k — во сколько раз рейтинг искупает цену; ПОРЯДОК СТРОК ЗАДАЁТ ТОЛЬКО ОН
    # (100 очков Elo = e^(100k) раз: 4.5× / 2.7× / 1.6×).
    # gamma — растяжение шкалы value 0..100, на ранжирование не влияет.
    quality:  { k: 0.015, gamma: 0.3 }
    balanced: { k: 0.01, gamma: 0.5 }   # дефолт
    budget:   { k: 0.005, gamma: 1.0 }
  default_preset: balanced

sources:
  lmarena:
    dataset: lmarena-ai/leaderboard-dataset
    split: latest
    # Ревизия датасета: `main` — свежая (резолвится в sha на каждом цикле и
    # пишется в снапшот), либо полный commit sha для жёсткого пина/отката.
    revision: main
    # Маппинг UI-вкладки → (subset датасета, значение поля category).
    # Схема сверена с датасетом на ревизии bc50ae8 (2026-09-06).
    # В text_style_control/latest 29 категорий: overall, coding, math, expert,
    # hard_prompts(_english), instruction_following, multi_turn, longer_query,
    # creative_writing, exclude_ties, industry_* (8 шт.), языковые (english,
    # chinese, russian, japanese, ...). Неизвестная категория больше не даёт
    # молча пустую вкладку — воркер пишет WARNING со списком доступных.
    categories:
      overall:  { subset: text_style_control, category: overall }
      coding:   { subset: text_style_control, category: coding }
      math:     { subset: text_style_control, category: math }
      research: { subset: text_style_control, category: expert }
      # Прокси, а не Agent Arena: в датасете есть subset `agent`, но он в шкале
      # score 0..1, а не Elo — scoring.presets.k подобран под очки Elo и на
      # такой шкале перестаёт влиять на value. Пока — hard_prompts.
      agent:    { subset: text_style_control, category: hard_prompts }
  openrouter:
    url: https://openrouter.ai/api/v1/models
    # Цена берётся не из каталога, а из /models/{slug}/endpoints: у половины
    # слагов провайдер не один, разброс доходит до 5x, и каталожный тариф —
    # это тариф дефолтного эндпоинта, а не дно рынка.
    price:
      # min — самый дешёвый сопоставимый эндпоинт (дно рынка)
      # median — типичная цена, устойчива к одиночному демпингу
      # catalog — прежнее поведение: тариф из /models
      policy: min
      # Что выбрасывается из выбора. Критерий один: те же веса или нет.
      # Тиры обслуживания (`openai/flex`, `google-vertex/global/priority`) веса
      # не меняют — это та же модель с другой очередью, и её цену реально можно
      # заплатить, поэтому список пуст. Сравнивается суффикс тега.
      exclude_tiers: []
      # Урезанные веса — другая модель: цена ниже, но рейтинг снят не с неё.
      exclude_quantizations: [fp4, int4]
      # Потолок детальных запросов за цикл (один на слаг) и параллелизм.
      max_models: 500
      max_workers: 8

# Маппинг имён LMArena -> id модели в OpenRouter заменён на автоматический
# (4-слойный матчинг в app/matcher.py). Ручные алиасы больше не нужны.
